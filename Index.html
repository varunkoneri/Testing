<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Easy Clock — Timer, Stopwatch, Reminders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171a;
    --panel: #1c2024;
    --panel-raised: #22262b;
    --line: #2c3136;
    --amber: #ffb454;
    --amber-dim: #8a6432;
    --teal: #4fd1c5;
    --teal-dim: #2c6b64;
    --red: #ff6b6b;
    --text: #ece8e1;
    --text-dim: #7d848c;
    --text-faint: #4d525a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
  }
  body {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 32px 16px 60px;
  }
  .app {
    width: 100%;
    max-width: 460px;
  }

  /* ---- Header ---- */
  .app-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    padding: 0 4px;
  }
  .app-title {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
  }
  .app-title span { color: var(--amber); }
  .app-sub {
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* ---- Mode selector (instrument switch bank) ---- */
  .mode-bank {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 6px;
    margin-bottom: 22px;
  }
  .mode-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
    padding: 10px 4px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .mode-btn:hover { color: var(--text); }
  .mode-btn.active {
    background: var(--panel-raised);
    color: var(--amber);
    box-shadow: inset 0 0 0 1px var(--amber-dim);
  }

  /* ---- Panel shell ---- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 22px 24px;
    position: relative;
    overflow: hidden;
  }
  .panel::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,180,84,0.35), transparent);
  }
  .view { display: none; }
  .view.active { display: block; }

  /* ---- Instrument bezel (shared signature element) ---- */
  .bezel-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 22px;
  }
  .bezel {
    width: 260px;
    height: 260px;
    position: relative;
  }
  .bezel svg { width: 100%; height: 100%; display: block; }
  .bezel-readout {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .readout-time {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: 0.01em;
    color: var(--text);
    text-shadow: 0 0 18px rgba(255,180,84,0.18);
    font-variant-numeric: tabular-nums;
  }
  .readout-time.mono-sm { font-size: 34px; }
  .readout-sub {
    margin-top: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .tick { stroke: var(--line); stroke-width: 2; }
  .tick.major { stroke: var(--text-faint); stroke-width: 2.5; }
  .sweep-track { fill: none; stroke: var(--line); stroke-width: 3; }
  .sweep-fill { fill: none; stroke: var(--amber); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 0.25s linear; }
  .sweep-fill.teal { stroke: var(--teal); }
  .sweep-fill.red { stroke: var(--red); }

  /* ---- Controls ---- */
  .controls {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--panel-raised);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.15s ease;
    min-width: 92px;
  }
  .btn:hover { border-color: var(--text-faint); }
  .btn:active { transform: scale(0.97); }
  .btn.primary { background: var(--amber); color: #1a1305; border-color: var(--amber); }
  .btn.primary:hover { background: #ffc178; }
  .btn.stop { background: var(--red); color: #2a0d0d; border-color: var(--red); }
  .btn.ghost { background: transparent; }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .format-btn { min-width: 70px; background: transparent; }
  .format-btn.active { background: var(--panel-raised); color: var(--amber); border-color: var(--amber-dim); }

  /* ---- Timer input ---- */
  .time-input-row {
    display: flex;
    justify-content: center;
    gap: 6px;
    margin-bottom: 20px;
  }
  .time-input-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .time-input {
    width: 62px;
    text-align: center;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 20px;
    font-weight: 600;
    padding: 10px 0;
    border-radius: 10px;
    outline: none;
  }
  .time-input:focus { border-color: var(--amber-dim); }
  .time-input-label {
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace;
  }
  .time-sep { align-self: center; padding-top: 10px; color: var(--text-faint); font-family: 'IBM Plex Mono', monospace; font-size: 20px; }

  /* ---- Presets ---- */
  .presets { display: flex; gap: 8px; justify-content: center; margin-bottom: 18px; flex-wrap: wrap; }
  .preset {
    appearance: none; border: 1px solid var(--line); background: transparent;
    color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; font-size: 10.5px;
    padding: 6px 12px; border-radius: 8px; cursor: pointer; letter-spacing: 0.05em;
  }
  .preset:hover { color: var(--amber); border-color: var(--amber-dim); }

  /* ---- Lap list / reminders list ---- */
  .list {
    margin-top: 20px;
    border-top: 1px solid var(--line);
    max-height: 220px;
    overflow-y: auto;
  }
  .list-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 4px;
    border-bottom: 1px solid var(--line);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
  }
  .list-row .idx { color: var(--text-faint); width: 30px; }
  .list-row .val { color: var(--text); font-variant-numeric: tabular-nums; }
  .list-row .delta { color: var(--teal); font-size: 11px; }
  .empty-note {
    text-align: center;
    color: var(--text-faint);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 22px 0 6px;
    letter-spacing: 0.04em;
  }

  /* ---- Reminders ---- */
  .reminder-form {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .reminder-input {
    flex: 1;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    padding: 11px 12px;
    border-radius: 10px;
    outline: none;
  }
  .reminder-input:focus { border-color: var(--amber-dim); }
  .reminder-time {
    width: 110px;
    background: var(--panel-raised);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    padding: 11px 8px;
    border-radius: 10px;
    outline: none;
  }
  .reminder-time:focus { border-color: var(--amber-dim); }
  .reminder-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 4px;
    border-bottom: 1px solid var(--line);
  }
  .reminder-item.fired { background: rgba(255,180,84,0.06); }
  .reminder-toggle {
    width: 34px; height: 20px;
    border-radius: 20px;
    background: var(--line);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.2s ease;
  }
  .reminder-toggle.on { background: var(--amber-dim); }
  .reminder-toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--text-dim);
    transition: transform 0.2s ease, background 0.2s ease;
  }
  .reminder-toggle.on::after { transform: translateX(14px); background: var(--amber); }
  .reminder-body { flex: 1; min-width: 0; }
  .reminder-label { font-size: 13.5px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .reminder-time-txt { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .reminder-del {
    background: none; border: none; color: var(--text-faint); cursor: pointer;
    font-size: 16px; padding: 4px 6px; line-height: 1; flex-shrink: 0;
  }
  .reminder-del:hover { color: var(--red); }

  /* ---- Alert overlay ---- */
  .alert-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,12,14,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 24px;
  }
  .alert-overlay.show { display: flex; }
  .alert-card {
    background: var(--panel-raised);
    border: 1px solid var(--amber-dim);
    border-radius: 20px;
    padding: 36px 28px;
    text-align: center;
    max-width: 320px;
    box-shadow: 0 0 60px rgba(255,180,84,0.15);
  }
  .alert-icon { font-size: 32px; margin-bottom: 12px; }
  .alert-title { font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber); margin-bottom: 8px; }
  .alert-msg { font-size: 16px; color: var(--text); margin-bottom: 22px; }

  @keyframes pulse-glow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.55; }
  }
  .pulsing { animation: pulse-glow 1.4s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce) {
    .pulsing { animation: none; }
    * { transition: none !important; }
  }

  @media (max-width: 400px) {
    .bezel { width: 220px; height: 220px; }
    .readout-time { font-size: 32px; }
    .time-input { width: 52px; font-size: 17px; }
  }

  /* ---- Name entry / welcome screens ---- */
  .gate-screen {
    position: fixed;
    inset: 0;
    z-index: 300;
    background: radial-gradient(circle at 50% 30%, #1c2024 0%, #0e1012 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: opacity 0.5s ease;
  }
  .gate-screen.gate-hide { opacity: 0; pointer-events: none; }
  .gate-card {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
  }
  .gate-mark {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.16em;
    color: var(--text-faint);
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .gate-mark span { color: var(--amber); }
  .gate-title {
    font-size: 19px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }
  .gate-input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel-raised);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    outline: none;
    text-align: center;
  }
  .gate-input::placeholder { color: var(--text-faint); }
  .gate-input:focus { border-color: var(--amber-dim); }
  .gate-submit {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--amber);
    background: var(--amber);
    color: #1a1305;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .gate-submit:active { transform: scale(0.98); }
  .gate-welcome-text {
    font-size: 22px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    animation: gate-pop 0.5s ease;
  }
  .gate-welcome-sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--amber);
  }
  @keyframes gate-pop {
    from { transform: scale(0.9); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  /* ---- Splash screen (first 3 seconds) ---- */
  .splash-screen {
    position: fixed;
    inset: 0;
    z-index: 400;
    background: #0b1330;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.6s ease;
  }
  .splash-screen.splash-hide {
    opacity: 0;
    pointer-events: none;
  }
  .splash-screen img {
    width: 46vw;
    max-width: 220px;
    min-width: 130px;
    border-radius: 22%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    animation: gate-pop 0.6s ease;
  }
</style>
</head>

    </div>

    <!-- TIMER -->
    <div class="view" id="view-timer">
      <div class="bezel-wrap">
        <div class="bezel">
          <svg viewBox="0 0 260 260" id="timer-svg"></svg>
          <div class="bezel-readout">
            <div class="readout-time" id="timer-time">00:00:00</div>
            <div class="readout-sub" id="timer-status">READY</div>
          </div>
        </div>
      </div>

      <div class="time-input-row" id="timer-inputs">
        <div class="time-input-group">
          <input class="time-input" id="timer-h" type="number" min="0" max="23" value="0" />
          <div class="time-input-label">HRS</div>
        </div>
        <div class="time-sep">:</div>
        <div class="time-input-group">
          <input class="time-input" id="timer-m" type="number" min="0" max="59" value="5" />
          <div class="time-input-label">MIN</div>
        </div>
        <div class="time-sep">:</div>
        <div class="time-input-group">
          <input class="time-input" id="timer-s" type="number" min="0" max="59" value="0" />
          <div class="time-input-label">SEC</div>
        </div>
      </div>

      <div class="presets">
        <button class="preset" data-secs="60">1m</button>
        <button class="preset" data-secs="300">5m</button>
        <button class="preset" data-secs="600">10m</button>
        <button class="preset" data-secs="900">15m</button>
        <button class="preset" data-secs="1800">30m</button>
      </div>

      <div class="controls">
        <button class="btn primary" id="timer-start">Start</button>
        <button class="btn" id="timer-pause" disabled>Pause</button>
        <button class="btn stop" id="timer-reset">Reset</button>
      </div>
    </div>

    <!-- STOPWATCH -->
    <div class="view" id="view-stopwatch">
      <div class="bezel-wrap">
        <div class="bezel">
          <svg viewBox="0 0 260 260" id="stopwatch-svg"></svg>
          <div class="bezel-readout">
            <div class="readout-time mono-sm" id="stopwatch-time">00:00.00</div>
            <div class="readout-sub" id="stopwatch-status">READY</div>
          </div>
        </div>
      </div>
      <div class="controls">
        <button class="btn primary" id="stopwatch-start">Start</button>
        <button class="btn" id="stopwatch-lap" disabled>Lap</button>
        <button class="btn stop" id="stopwatch-reset">Reset</button>
      </div>
      <div class="list" id="stopwatch-laps">
        <div class="empty-note">Laps will appear here</div>
      </div>
    </div>

    <!-- REMINDERS -->
    <div class="view" id="view-reminders">
      <div class="reminder-form">
        <input class="reminder-input" id="reminder-label" type="text" placeholder="Reminder label" maxlength="60" />
        <input class="reminder-time" id="reminder-time" type="time" />
      </div>
      <div class="controls" style="margin-bottom: 4px;">
        <button class="btn primary" id="reminder-add" style="width:100%; min-width: 0;">Add reminder</button>
      </div>
      <div class="list" id="reminder-list">
        <div class="empty-note">No reminders set yet</div>
      </div>
    </div>

  </div>
</div>

<div class="alert-overlay" id="alert-overlay">
  <div class="alert-card">
    <div class="alert-icon pulsing">⏰</div>
    <div class="alert-title" id="alert-title">REMINDER</div>
    <div class="alert-msg" id="alert-msg">Time's up</div>
    <button class="btn primary" id="alert-dismiss">Continue</button>
  </div>
</div>

<script>
(function() {

  // ---------- Splash screen (first 3 seconds) ----------
  const splashEl = document.getElementById("easy-clock-splash");
  const gateNameOuter = document.getElementById("gate-name");
  gateNameOuter.style.display = "none";
  setTimeout(() => {
    splashEl.classList.add("splash-hide");
    setTimeout(() => {
      splashEl.remove();
      gateNameOuter.style.display = "flex";
      gateNameInputFocusLater();
    }, 600);
  }, 3000);

  function gateNameInputFocusLater() {
    const input = document.getElementById("gate-name-input");
    if (input) input.focus();
  }

  // ---------- Name gate / welcome flow ----------
  const gateName = document.getElementById("gate-name");
  const gateWelcome = document.getElementById("gate-welcome");
  const gateWelcomeText = document.getElementById("gate-welcome-text");
  const gateNameInput = document.getElementById("gate-name-input");
  const gateNameSubmit = document.getElementById("gate-name-submit");
  const appRoot = document.getElementById("app-root");

  function revealApp() {
    appRoot.style.visibility = "visible";
  }

  function showWelcome(name) {
    gateWelcomeText.textContent = `Hi ${name}, Easy Clock welcomes you`;
    gateWelcome.style.display = "flex";
    revealApp();
    setTimeout(() => {
      gateWelcome.classList.add("gate-hide");
      setTimeout(() => gateWelcome.remove(), 500);
    }, 2000);
  }

  function submitName() {
    const val = (gateNameInput.value || "").trim();
    if (!val) { gateNameInput.focus(); return; }
    unlockAudio();
    gateName.classList.add("gate-hide");
    setTimeout(() => {
      gateName.remove();
      showWelcome(val);
    }, 400);
  }

  gateNameSubmit.addEventListener("click", submitName);
  gateNameInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitName(); });
  gateNameInput.focus();

  const testSoundBtn = document.getElementById("test-sound-btn");
  if (testSoundBtn) {
    testSoundBtn.addEventListener("click", () => {
      unlockAudio();
      beep(2);
    });
  }

  // ---------- Shared bezel builder ----------
  function buildBezel(svgEl, radius, sweepClass) {
    const cx = 130, cy = 130;
    let ticks = "";
    for (let i = 0; i < 60; i++) {
      const angle = (i / 60) * Math.PI * 2 - Math.PI / 2;
      const isMajor = i % 5 === 0;
      const rOuter = radius;
      const rInner = radius - (isMajor ? 12 : 6);
      const x1 = cx + rOuter * Math.cos(angle);
      const y1 = cy + rOuter * Math.sin(angle);
      const x2 = cx + rInner * Math.cos(angle);
      const y2 = cy + rInner * Math.sin(angle);
      ticks += `<line class="tick${isMajor ? ' major' : ''}" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" />`;
    }
    const trackR = radius - 24;
    const circumference = 2 * Math.PI * trackR;
    svgEl.innerHTML = `
      <circle class="sweep-track" cx="${cx}" cy="${cy}" r="${trackR}" />
      <circle class="sweep-fill ${sweepClass || ''}" id="${svgEl.id}-sweep"
        cx="${cx}" cy="${cy}" r="${trackR}"
        stroke-dasharray="${circumference.toFixed(2)}"
        stroke-dashoffset="${circumference.toFixed(2)}"
        transform="rotate(-90 ${cx} ${cy})" />
      ${ticks}
    `;
    return { circumference, trackR };
  }

  function setSweep(svgId, fraction) {
    const el = document.getElementById(svgId + "-sweep");
    if (!el) return;
    const circumference = parseFloat(el.getAttribute("stroke-dasharray"));
    const clamped = Math.max(0, Math.min(1, fraction));
    el.setAttribute("stroke-dashoffset", (circumference * (1 - clamped)).toFixed(2));
  }

  function pad(n, len) { return String(Math.floor(n)).padStart(len || 2, "0"); }

  // ---------- Beep ----------
  let audioCtx = null;
  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      // Play a near-silent buffer to fully unlock on strict mobile browsers (e.g. iOS Safari)
      const buffer = audioCtx.createBuffer(1, 1, 22050);
      const src = audioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(audioCtx.destination);
      src.start(0);
    } catch (e) { /* audio unavailable */ }
  }
  ["click", "touchend", "keydown"].forEach(evt => {
    document.addEventListener(evt, unlockAudio, { once: true, passive: true });
  });
  function beep(times) {
    times = times || 2;
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") { audioCtx.resume(); }
      let t = audioCtx.currentTime;
      for (let i = 0; i < times; i++) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t);
        osc.stop(t + 0.3);
        t += 0.38;
      }
    } catch (e) { /* audio unavailable */ }
  }

  // ---------- Mode switching ----------
  const modeButtons = document.querySelectorAll(".mode-btn");
  const views = {
    clock: document.getElementById("view-clock"),
    timer: document.getElementById("view-timer"),
    stopwatch: document.getElementById("view-stopwatch"),
    reminders: document.getElementById("view-reminders")
  };
  modeButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      modeButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      Object.values(views).forEach(v => v.classList.remove("active"));
      views[btn.dataset.mode].classList.add("active");
    });
  });

  // ================= CLOCK =================
  const clockSvg = document.getElementById("clock-svg");
  buildBezel(clockSvg, 118, "");
  const clockTimeEl = document.getElementById("clock-time");
  const clockZoneEl = document.getElementById("clock-zone");
  const dateEl = document.getElementById("today-date");
  let use24h = true;
  const format24Btn = document.getElementById("format-24");
  const format12Btn = document.getElementById("format-12");

  function setFormat(is24) {
    use24h = is24;
    format24Btn.classList.toggle("active", is24);
    format12Btn.classList.toggle("active", !is24);
  }
  format24Btn.addEventListener("click", () => setFormat(true));
  format12Btn.addEventListener("click", () => setFormat(false));

  function updateClock() {
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    let suffix = "";
    if (!use24h) {
      suffix = h >= 12 ? " PM" : " AM";
      h = h % 12; if (h === 0) h = 12;
    }
    clockTimeEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}${suffix}`;
    const secFraction = (m * 60 + s) / 3600; // sweeps fully every hour
    setSweep("clock-svg", secFraction);
    try {
      clockZoneEl.textContent = Intl.DateTimeFormat().resolvedOptions().timeZone.replace(/_/g, " ").toUpperCase();
    } catch (e) { clockZoneEl.textContent = "LOCAL TIME"; }
    dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }).toUpperCase();
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ================= TIMER =================
  const timerSvg = document.getElementById("timer-svg");
  buildBezel(timerSvg, 118, "");
  const timerTimeEl = document.getElementById("timer-time");
  const timerStatusEl = document.getElementById("timer-status");
  const timerH = document.getElementById("timer-h");
  const timerM = document.getElementById("timer-m");
  const timerS = document.getElementById("timer-s");
  const timerInputs = document.getElementById("timer-inputs");
  const timerStartBtn = document.getElementById("timer-start");
  const timerPauseBtn = document.getElementById("timer-pause");
  const timerResetBtn = document.getElementById("timer-reset");

  let timerTotalSecs = 0;
  let timerRemaining = 0;
  let timerInterval = null;
  let timerRunning = false;

  function renderTimerDisplay(secs) {
    const h = Math.floor(secs / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = Math.floor(secs % 60);
    timerTimeEl.textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
    const frac = timerTotalSecs > 0 ? secs / timerTotalSecs : 0;
    setSweep("timer-svg", frac);
  }

  function getInputSeconds() {
    const h = parseInt(timerH.value, 10) || 0;
    const m = parseInt(timerM.value, 10) || 0;
    const s = parseInt(timerS.value, 10) || 0;
    return h * 3600 + m * 60 + s;
  }

  renderTimerDisplay(getInputSeconds());
  [timerH, timerM, timerS].forEach(inp => {
    inp.addEventListener("input", () => {
      if (!timerRunning) {
        timerTotalSecs = getInputSeconds();
        renderTimerDisplay(timerTotalSecs);
      }
    });
  });

  document.querySelectorAll(".preset").forEach(btn => {
    btn.addEventListener("click", () => {
      if (timerRunning) return;
      const secs = parseInt(btn.dataset.secs, 10);
      timerH.value = Math.floor(secs / 3600);
      timerM.value = Math.floor((secs % 3600) / 60);
      timerS.value = secs % 60;
      timerTotalSecs = secs;
      renderTimerDisplay(secs);
    });
  });

  function timerTick() {
    timerRemaining -= 1;
    if (timerRemaining <= 0) {
      timerRemaining = 0;
      renderTimerDisplay(0);
      stopTimerInterval();
      timerStatusEl.textContent = "COMPLETE";
      showAlert("TIMER", "Your timer is done.");
      timerStartBtn.disabled = false;
      timerPauseBtn.disabled = true;
      return;
    }
    renderTimerDisplay(timerRemaining);
  }

  function startTimerInterval() {
    timerInterval = setInterval(timerTick, 1000);
  }
  function stopTimerInterval() {
    clearInterval(timerInterval);
    timerInterval = null;
    timerRunning = false;
  }

  timerStartBtn.addEventListener("click", () => {
    if (timerRemaining <= 0) {
      timerTotalSecs = getInputSeconds();
      timerRemaining = timerTotalSecs;
    }
    if (timerTotalSecs <= 0) return;
    timerRunning = true;
    timerStatusEl.textContent = "RUNNING";
    timerInputs.style.opacity = "0.4";
    timerStartBtn.disabled = true;
    timerPauseBtn.disabled = false;
    startTimerInterval();
  });

  timerPauseBtn.addEventListener("click", () => {
    stopTimerInterval();
    timerStatusEl.textContent = "PAUSED";
    timerStartBtn.disabled = false;
    timerPauseBtn.disabled = true;
  });

  timerResetBtn.addEventListener("click", () => {
    stopTimerInterval();
    timerRemaining = 0;
    timerTotalSecs = getInputSeconds();
    renderTimerDisplay(timerTotalSecs);
    timerStatusEl.textContent = "READY";
    timerInputs.style.opacity = "1";
    timerStartBtn.disabled = false;
    timerPauseBtn.disabled = true;
  });

  // ================= STOPWATCH =================
  const stopwatchSvg = document.getElementById("stopwatch-svg");
  buildBezel(stopwatchSvg, 118, "teal");
  const stopwatchTimeEl = document.getElementById("stopwatch-time");
  const stopwatchStatusEl = document.getElementById("stopwatch-status");
  const stopwatchStartBtn = document.getElementById("stopwatch-start");
  const stopwatchLapBtn = document.getElementById("stopwatch-lap");
  const stopwatchResetBtn = document.getElementById("stopwatch-reset");
  const stopwatchLapsEl = document.getElementById("stopwatch-laps");

  let swElapsed = 0; // ms
  let swStartTs = null;
  let swInterval = null;
  let swRunning = false;
  let swLaps = [];

  function renderStopwatch(ms) {
    const totalCentis = Math.floor(ms / 10);
    const m = Math.floor(totalCentis / 6000);
    const s = Math.floor((totalCentis % 6000) / 100);
    const c = totalCentis % 100;
    stopwatchTimeEl.textContent = `${pad(m)}:${pad(s)}.${pad(c)}`;
    const frac = (ms % 60000) / 60000; // sweeps every minute
    setSweep("stopwatch-svg", frac);
  }

  function swTick() {
    const now = performance.now();
    renderStopwatch(swElapsed + (now - swStartTs));
  }

  stopwatchStartBtn.onclick = () => {
    if (!swRunning) {
      swRunning = true;
      swStartTs = performance.now();
      swInterval = setInterval(swTick, 30);
      stopwatchStatusEl.textContent = "RUNNING";
      stopwatchStartBtn.textContent = "Pause";
      stopwatchLapBtn.disabled = false;
    } else {
      swRunning = false;
      swElapsed += performance.now() - swStartTs;
      clearInterval(swInterval);
      stopwatchStatusEl.textContent = "PAUSED";
      stopwatchStartBtn.textContent = "Resume";
      stopwatchLapBtn.disabled = true;
    }
  };

  stopwatchLapBtn.addEventListener("click", () => {
    if (!swRunning) return;
    const now = performance.now();
    const total = swElapsed + (now - swStartTs);
    const prevTotal = swLaps.length ? swLaps[swLaps.length - 1].total : 0;
    swLaps.push({ total, delta: total - prevTotal });
    renderLaps();
  });

  stopwatchResetBtn.addEventListener("click", () => {
    swRunning = false;
    clearInterval(swInterval);
    swElapsed = 0;
    swLaps = [];
    renderStopwatch(0);
    stopwatchStatusEl.textContent = "READY";
    stopwatchStartBtn.textContent = "Start";
    stopwatchLapBtn.disabled = true;
    renderLaps();
  });

  function fmtMs(ms) {
    const totalCentis = Math.floor(ms / 10);
    const m = Math.floor(totalCentis / 6000);
    const s = Math.floor((totalCentis % 6000) / 100);
    const c = totalCentis % 100;
    return `${pad(m)}:${pad(s)}.${pad(c)}`;
  }

  function renderLaps() {
    if (!swLaps.length) {
      stopwatchLapsEl.innerHTML = `<div class="empty-note">Laps will appear here</div>`;
      return;
    }
    stopwatchLapsEl.innerHTML = swLaps.map((lap, i) => `
      <div class="list-row">
        <span class="idx">L${swLaps.length - i}</span>
        <span class="val">${fmtMs(lap.total)}</span>
        <span class="delta">+${fmtMs(lap.delta)}</span>
      </div>
    `).reverse().join("");
  }

  renderStopwatch(0);

  // ================= REMINDERS =================
  const reminderLabelInput = document.getElementById("reminder-label");
  const reminderTimeInput = document.getElementById("reminder-time");
  const reminderAddBtn = document.getElementById("reminder-add");
  const reminderListEl = document.getElementById("reminder-list");

  let reminders = []; // { id, label, time: "HH:MM", enabled, firedToday }

  function renderReminders() {
    if (!reminders.length) {
      reminderListEl.innerHTML = `<div class="empty-note">No reminders set yet</div>`;
      return;
    }
    const sorted = [...reminders].sort((a, b) => a.time.localeCompare(b.time));
    reminderListEl.innerHTML = sorted.map(r => `
      <div class="reminder-item ${r.firedToday ? 'fired' : ''}" data-id="${r.id}">
        <div class="reminder-toggle ${r.enabled ? 'on' : ''}" data-action="toggle" data-id="${r.id}"></div>
        <div class="reminder-body">
          <div class="reminder-label">${escapeHtml(r.label || 'Reminder')}</div>
          <div class="reminder-time-txt">${formatTimeLabel(r.time)}</div>
        </div>
        <button class="reminder-del" data-action="delete" data-id="${r.id}">×</button>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatTimeLabel(hhmm) {
    const [h, m] = hhmm.split(":").map(Number);
    const suffix = h >= 12 ? "PM" : "AM";
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return `${pad(h12)}:${pad(m)} ${suffix}`;
  }

  reminderAddBtn.addEventListener("click", () => {
    const label = reminderLabelInput.value.trim();
    const time = reminderTimeInput.value;
    if (!time) { reminderTimeInput.focus(); return; }
    reminders.push({ id: Date.now(), label, time, enabled: true, firedToday: false });
    reminderLabelInput.value = "";
    reminderTimeInput.value = "";
    renderReminders();
  });

  reminderListEl.addEventListener("click", (e) => {
    const target = e.target.closest("[data-action]");
    if (!target) return;
    const id = Number(target.dataset.id);
    if (target.dataset.action === "toggle") {
      const r = reminders.find(x => x.id === id);
      if (r) r.enabled = !r.enabled;
    } else if (target.dataset.action === "delete") {
      reminders = reminders.filter(x => x.id !== id);
    }
    renderReminders();
  });

  function checkReminders() {
    const now = new Date();
    const hhmm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    if (now.getHours() === 0 && now.getMinutes() === 0 && now.getSeconds() < 2) {
      reminders.forEach(r => r.firedToday = false); // reset daily
    }
    reminders.forEach(r => {
      if (r.enabled && !r.firedToday && r.time === hhmm) {
        r.firedToday = true;
        showAlert("REMINDER", r.label || "You have a reminder");
        renderReminders();
      }
    });
  }
  setInterval(checkReminders, 1000);

  // ================= Alert overlay =================
  const alertOverlay = document.getElementById("alert-overlay");
  const alertTitle = document.getElementById("alert-title");
  const alertMsg = document.getElementById("alert-msg");
  const alertDismiss = document.getElementById("alert-dismiss");
  let ringInterval = null;

  function startRinging() {
    stopRinging(); // guard against overlapping loops
    beep(1);
    ringInterval = setInterval(() => beep(1), 500);
  }
  function stopRinging() {
    if (ringInterval) {
      clearInterval(ringInterval);
      ringInterval = null;
    }
  }

  function showAlert(title, msg) {
    alertTitle.textContent = title;
    alertMsg.textContent = msg;
    alertOverlay.classList.add("show");
    startRinging();
  }
  alertDismiss.addEventListener("click", () => {
    alertOverlay.classList.remove("show");
    stopRinging();
  });

})();
</script>
</body>
</html>
