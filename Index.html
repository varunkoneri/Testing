<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Easy Browser — Welcome Back</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #050b1f;
    --bg-mid: #0a1642;
    --bg-card: rgba(16, 27, 63, 0.55);
    --border: rgba(255,255,255,0.10);
    --blue: #2f7dfa;
    --blue-light: #6fb1ff;
    --blue-deep: #1550c9;
    --cyan: #4fd6ff;
    --text: #eef3ff;
    --text-dim: #93a6d6;
    --text-faint: #5c6a94;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    color: var(--text);
    background: var(--bg-deep);
  }
  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 20px;
    overflow-x: hidden;
  }

  /* ---- Atmosphere background ---- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 900px 700px at 50% 8%, rgba(47,125,250,0.28), transparent 60%),
      radial-gradient(ellipse 600px 500px at 8% 85%, rgba(63,208,255,0.10), transparent 65%),
      radial-gradient(ellipse 700px 600px at 95% 70%, rgba(47,125,250,0.16), transparent 60%),
      linear-gradient(180deg, #050b1f 0%, #071230 45%, #050b1f 100%);
  }
  .bg-dots {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.5;
    background-image: radial-gradient(rgba(111,177,255,0.35) 1px, transparent 1px);
    background-size: 34px 34px;
    mask-image: radial-gradient(ellipse 700px 900px at 8% 60%, black 0%, transparent 70%);
  }
  .bg-rays {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: repeating-linear-gradient(
      115deg,
      transparent 0px,
      transparent 46px,
      rgba(111,177,255,0.05) 47px,
      transparent 49px
    );
    mask-image: radial-gradient(ellipse 700px 900px at 96% 55%, black 0%, transparent 68%);
  }

  .page { position: relative; z-index: 1; width: 100%; max-width: 420px; }

  /* ---- Logo mark (signature element) ---- */
  .brand { text-align: center; margin-bottom: 26px; }
  .logo-wrap { position: relative; width: 108px; height: 108px; margin: 0 auto 18px; }
  .logo-orb {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #bfe0ff 0%, #4fa9ff 32%, #1a5fe0 68%, #0d3a9c 100%);
    box-shadow: 0 0 46px rgba(47,125,250,0.55), inset -10px -10px 24px rgba(0,10,40,0.35);
    position: relative;
    overflow: hidden;
  }
  .logo-orb::before {
    /* the "e" swoosh, built from two offset arcs */
    content: "";
    position: absolute;
    left: -14%;
    top: 44%;
    width: 128%;
    height: 34%;
    background: linear-gradient(180deg, #ffffff 0%, #dfe9ff 100%);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    transform: rotate(-9deg);
    box-shadow: 0 3px 8px rgba(0,10,40,0.25);
  }
  .logo-orb::after {
    content: "";
    position: absolute;
    left: 18%;
    top: 20%;
    width: 64%;
    height: 62%;
    border-radius: 50%;
    background: transparent;
    border: 15px solid #0b2f8a;
    border-right-color: transparent;
    border-bottom-color: transparent;
    transform: rotate(38deg);
  }
  .spark { position: absolute; color: var(--cyan); }
  .spark svg { width: 100%; height: 100%; display: block; }
  .spark-1 { top: -6px; right: -8px; width: 22px; height: 22px; animation: twinkle 2.4s ease-in-out infinite; }
  .spark-2 { top: 14px; right: -22px; width: 13px; height: 13px; animation: twinkle 2.4s ease-in-out infinite 0.6s; }
  @keyframes twinkle {
    0%, 100% { opacity: 0.35; transform: scale(0.85); }
    50% { opacity: 1; transform: scale(1.05); }
  }

  .brand-title {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -0.01em;
    margin: 0 0 6px;
  }
  .brand-tag {
    font-size: 14px;
    color: var(--blue-light);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .brand-tag .dot { color: var(--text-faint); margin: 0 8px; }

  /* ---- Card ---- */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px 28px 26px;
    backdrop-filter: blur(18px);
    box-shadow: 0 30px 60px rgba(0,4,20,0.45);
  }
  .card-head { text-align: center; margin-bottom: 22px; }
  .card-title {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 21px;
    margin: 0 0 6px;
  }
  .card-sub { font-size: 13.5px; color: var(--text-dim); margin: 0; }

  .field { position: relative; margin-bottom: 14px; }
  .field-icon {
    position: absolute;
    left: 16px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-faint);
    width: 18px; height: 18px;
    pointer-events: none;
  }
  .field input {
    width: 100%;
    background: rgba(255,255,255,0.045);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    padding: 15px 16px 15px 46px;
    border-radius: 14px;
    outline: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .field input::placeholder { color: var(--text-faint); }
  .field input:focus { border-color: var(--blue); background: rgba(47,125,250,0.07); }
  .field.has-toggle input { padding-right: 46px; }
  .toggle-visibility {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--text-faint);
    cursor: pointer;
    padding: 4px;
    display: flex;
  }
  .toggle-visibility:hover { color: var(--text-dim); }
  .toggle-visibility svg { width: 18px; height: 18px; }

  .form-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 4px 2px 20px;
    font-size: 13px;
  }
  .remember { display: flex; align-items: center; gap: 8px; color: var(--text-dim); cursor: pointer; user-select: none; }
  .remember input { appearance: none; width: 17px; height: 17px; border-radius: 5px; border: 1.5px solid var(--text-faint); background: transparent; cursor: pointer; position: relative; flex-shrink: 0; }
  .remember input:checked { background: var(--blue); border-color: var(--blue); }
  .remember input:checked::after {
    content: "";
    position: absolute; left: 5px; top: 1px;
    width: 4px; height: 8px;
    border: solid white; border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .forgot-link { color: var(--blue-light); text-decoration: none; font-weight: 600; }
  .forgot-link:hover { text-decoration: underline; }

  .btn-login {
    width: 100%;
    border: none;
    border-radius: 14px;
    padding: 15px 18px;
    background: linear-gradient(90deg, var(--blue-deep), var(--blue) 55%, var(--blue-light));
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.01em;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 12px 28px rgba(47,125,250,0.35);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .btn-login:hover { box-shadow: 0 14px 32px rgba(47,125,250,0.48); }
  .btn-login:active { transform: scale(0.985); }
  .btn-login svg { width: 17px; height: 17px; transition: transform 0.15s ease; }
  .btn-login:hover svg { transform: translateX(3px); }

  .form-msg {
    text-align: center;
    font-size: 12.5px;
    color: #ff8a8a;
    min-height: 16px;
    margin-top: 10px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 18px;
    color: var(--text-faint);
    font-size: 12px;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .social-row { display: flex; justify-content: center; gap: 14px; margin-bottom: 22px; }
  .social-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.12s ease;
  }
  .social-btn:hover { border-color: var(--blue); background: rgba(47,125,250,0.08); transform: translateY(-2px); }
  .social-btn svg { width: 20px; height: 20px; }

  .signup-line { text-align: center; font-size: 13.5px; color: var(--text-dim); }
  .signup-line a { color: var(--blue-light); font-weight: 700; text-decoration: none; }
  .signup-line a:hover { text-decoration: underline; }

  /* ---- Feature strip ---- */
  .features {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 6px 0;
    margin-top: 26px;
  }
  .feature {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 0 16px;
    font-size: 12.5px;
    color: var(--text-dim);
    border-right: 1px solid var(--border);
    white-space: nowrap;
  }
  .feature:last-child { border-right: none; }
  .feature svg { width: 15px; height: 15px; color: var(--blue-light); flex-shrink: 0; }

  @media (prefers-reduced-motion: reduce) {
    .spark { animation: none !important; }
    * { transition: none !important; }
  }

  @media (max-width: 460px) {
    .card { padding: 26px 20px 22px; border-radius: 20px; }
    .brand-title { font-size: 28px; }
    .feature { padding: 0 10px; font-size: 11.5px; }
  }
</style>
</head>
<body>

<div class="bg"></div>
<div class="bg-dots"></div>
<div class="bg-rays"></div>

<div class="page">

  <div class="brand">
    <div class="logo-wrap">
      <div class="logo-orb"></div>
      <div class="spark spark-1"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.2 8.8L21 12l-6.8 3.2L12 24l-2.2-8.8L3 12l6.8-3.2z"/></svg></div>
      <div class="spark spark-2"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0l2.2 8.8L21 12l-6.8 3.2L12 24l-2.2-8.8L3 12l6.8-3.2z"/></svg></div>
    </div>
    <h1 class="brand-title">Easy Browser</h1>
    <div class="brand-tag">Fast<span class="dot">·</span>Smart<span class="dot">·</span>Secure</div>
  </div>

  <div class="card">
    <div class="card-head">
      <h2 class="card-title">Welcome back</h2>
      <p class="card-sub">Log in to continue to Easy Browser</p>
    </div>

    <form id="login-form" novalidate>
      <div class="field">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 20c0-4 3.6-7 8-7s8 3 8 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <input type="text" id="username" placeholder="Username or email" autocomplete="username" />
      </div>

      <div class="field has-toggle">
        <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3" stroke-linecap="round"/></svg>
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
        <button type="button" class="toggle-visibility" id="toggle-pw" aria-label="Show password">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="form-row">
        <label class="remember">
          <input type="checkbox" id="remember" checked />
          Remember me
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login">
        Log in
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="form-msg" id="form-msg"></div>
    </form>

    <div class="divider">or continue with</div>

    <div class="social-row">
      <button class="social-btn" aria-label="Continue with Google">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.67-.22-2.45H12v4.64h6.47a5.53 5.53 0 01-2.4 3.63v3h3.88c2.27-2.09 3.57-5.17 3.57-8.82z"/><path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.91l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.26v3.1A12 12 0 0012 24z"/><path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 014.9 12c0-.79.14-1.56.37-2.28v-3.1H1.26A12 12 0 000 12c0 1.94.46 3.77 1.26 5.38l4.01-3.1z"/><path fill="#EA4335" d="M12 4.77c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0A12 12 0 001.26 6.62l4.01 3.1C6.22 6.88 8.87 4.77 12 4.77z"/></svg>
      </button>
      <button class="social-btn" aria-label="Continue with Apple">
        <svg viewBox="0 0 24 24" fill="#eef3ff"><path d="M16.36 1.43c0 1.14-.42 2.2-1.13 3.03-.82.96-2.11 1.7-3.24 1.6-.13-1.1.44-2.26 1.14-3.04.82-.94 2.23-1.66 3.23-1.59zM20.6 17.3c-.5 1.15-.74 1.67-1.38 2.68-.9 1.42-2.16 3.18-3.73 3.2-1.4.02-1.76-.9-3.66-.9-1.9 0-2.3.88-3.68.92-1.55.05-2.73-1.53-3.63-2.94-2.4-3.7-2.65-8.05-1.17-10.37.98-1.6 2.63-2.66 4.34-2.68 1.5-.03 2.9.99 3.68.99.78 0 2.46-1.22 4.15-1.04.7.03 2.68.28 3.95 2.1-.1.06-2.36 1.35-2.33 4.05.03 3.24 2.87 4.32 2.46 4z"/></svg>
      </button>
      <button class="social-btn" aria-label="Continue with email">
        <svg viewBox="0 0 24 24" fill="none" stroke="#eef3ff" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M3 6.5l9 6.5 9-6.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="signup-line">Don't have an account? <a href="#">Sign up</a></div>
  </div>

  <div class="features">
    <div class="feature"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 0L3 14h7l-2 10 11-15h-8z"/></svg>Lightning fast</div>
    <div class="feature"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1l8 3v6c0 5.5-3.4 9.7-8 13-4.6-3.3-8-7.5-8-13V4z"/></svg>Super secure</div>
    <div class="feature"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18a4 4 0 01-.5-7.97A5.5 5.5 0 0116 8.06 4.5 4.5 0 0117.5 17H6z"/></svg>Cloud sync</div>
    <div class="feature"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2h12v20l-6-4-6 4z"/></svg>Bookmarks &amp; more</div>
  </div>

</div>

<script>
(function() {
  const pwInput = document.getElementById("password");
  const toggleBtn = document.getElementById("toggle-pw");
  const eyeIcon = document.getElementById("eye-icon");

  toggleBtn.addEventListener("click", () => {
    const isPw = pwInput.type === "password";
    pwInput.type = isPw ? "text" : "password";
    toggleBtn.setAttribute("aria-label", isPw ? "Hide password" : "Show password");
    eyeIcon.innerHTML = isPw
      ? '<path d="M3 3l18 18" stroke-linecap="round"/><path d="M10.6 10.6a3 3 0 004.24 4.24M9.9 4.24A10.9 10.9 0 0112 4c7 0 11 8 11 8a17.6 17.6 0 01-3.06 4.06M6.1 6.1A17.7 17.7 0 001 12s4 8 11 8a10.6 10.6 0 004.9-1.2" stroke-linecap="round" stroke-linejoin="round"/>'
      : '<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3"/>';
  });

  const form = document.getElementById("login-form");
  const msg = document.getElementById("form-msg");
  const usernameInput = document.getElementById("username");

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!usernameInput.value.trim() || !pwInput.value) {
      msg.textContent = "Enter your username and password to continue.";
      return;
    }
    msg.style.color = "#7fd8a0";
    msg.textContent = "Login form ready — connect this to your auth backend to sign users in.";
  });
})();
</script>

</body>
</html>
